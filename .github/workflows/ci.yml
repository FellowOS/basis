name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: sema
          POSTGRES_PASSWORD: sema
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sema -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SEMA_TEST_POSTGRES_URL: postgresql://sema:sema@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: PostgreSQL integration and backup restore
        run: >-
          uv run pytest tests/test_postgres_integration.py
          tests/test_postgres_backup_restore.py -q

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        run: pnpm --filter @sema/web build

      - name: Unit tests
        run: pnpm --filter @sema/web test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @sema/web exec playwright install chromium --with-deps

      - name: Playwright smoke
        run: CI=1 pnpm test:e2e
        env:
          SEMA_E2E_API_PORT: 8091
          SEMA_E2E_WEB_PORT: 5174

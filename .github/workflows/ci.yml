name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: basis
          POSTGRES_PASSWORD: basis
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basis -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BASIS_TEST_POSTGRES_URL: postgresql://basis:basis@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: PostgreSQL integration and backup restore
        run: >-
          uv run pytest tests/test_postgres_integration.py
          tests/test_postgres_backup_restore.py -q

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Regenerate OpenAPI v1 YAML
        run: uv run python scripts/generate-openapi-v1.py --data-dir /tmp/basis-openapi-gen

      - name: Fail on OpenAPI drift
        run: git diff --exit-code openapi/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spectral lint OpenAPI v1
        run: >-
          npx --yes @stoplight/spectral-cli@6.15.0 lint
          openapi/basis-v1.yaml openapi/basis-v1-kb.yaml openapi/basis-v1-platform.yaml

      - name: Web ↔ OpenAPI path audit (S0)
        run: node scripts/audit-web-openapi-paths.mjs

      - name: Web ↔ operationId audit (S0)
        run: uv run python scripts/audit-web-operation-ids.py

  client-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate web OpenAPI types
        working-directory: web
        run: npm ci && npm run gen:openapi-types

      - name: Fail on schema drift
        run: git diff --exit-code web/src/lib/basis-openapi/schema.d.ts web/src/lib/basis-openapi/schema-kb.d.ts

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke
        run: CI=1 npm run test:e2e
        env:
          BASIS_E2E_API_PORT: 8091
          BASIS_E2E_WEB_PORT: 5174

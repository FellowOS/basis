[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basis"
version = "0.1.0"
description = "Knowledge application framework built on the semantica SDK"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  # semantica SDK — Basis 运行时推荐组合（见 README「semantica 依赖」）
  "semantica[documents,parse-pdf,nlp-spacy,llm-openai,embeddings-local,vectorstore-faiss,vectorstore-sqlite,shacl,split-tiktoken,ingest-git]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "authlib>=1.3.2",
  "httpx>=0.27",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "PyYAML>=6",
  "schemathesis>=3.38",
]
# 扫描件 PDF、更多向量后端、多 LLM 网关（体积大，按需装）
heavy = [
  "semantica[parse-docling,vectorstore-pgvector,llm-litellm,graph-neo4j]",
]
explorer = [
  "semantica[explorer]",
]
saml = [
  "python3-saml>=1.16.0",
]

[project.scripts]
basis = "basis.cli:main"

[tool.setuptools.packages.find]
include = ["basis*"]

[tool.setuptools.package-data]
basis = ["platform/admin/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
semantica = { path = "../../semantica", editable = true }

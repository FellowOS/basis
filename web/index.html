<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Basis — Verifiable context for AI agents</title>
    <meta
      name="description"
      content="Open-source, self-hosted context for enterprise agents. Connect documents, databases, and 1,000+ systems; every answer cites evidence, every write goes through review."
    />
    <meta name="application-name" content="Basis" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Basis" />
    <meta property="og:title" content="Basis — Verifiable context for AI agents" />
    <meta
      property="og:description"
      content="Open-source, self-hosted context for enterprise agents. Evidence-backed reads, governed write-backs, OpenAPI v1 and MCP."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Basis — Verifiable context for AI agents" />
    <meta
      name="twitter:description"
      content="Open-source, self-hosted context for enterprise agents. Evidence-backed reads, governed write-backs, OpenAPI v1 and MCP."
    />
    <style>
      /* Avoid white flash before JS/CSS (matches login-marketing-shell). */
      html {
        background: #ffffff;
        color-scheme: light;
      }
      html.dark {
        background: #090b10;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: inherit;
      }
      #root {
        min-height: 100dvh;
        background: inherit;
      }
    </style>
    <script>
      (function () {
        var key = 'fellow:theme';
        var theme = 'light';
        try {
          var stored = localStorage.getItem(key);
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (_) {}
        var root = document.documentElement;
        if (theme === 'dark') root.classList.add('dark');
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

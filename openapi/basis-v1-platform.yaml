openapi: 3.1.0
info:
  title: Basis API — platform
  version: 1.0.0
  description: 'Normative HTTP contract for Basis. Paths use /api/v1 prefix.


    **Two surfaces** (see x-basis-surface on each operation):

    - `platform` — console & system/org admin; **session JWT** (`sessionAuth`).

    - `knowledge-base` — KB data & integration (MCP parity); **session or KB API token** (`kbApiTokenAuth`).


    Split specs: basis-v1-platform.yaml, basis-v1-kb.yaml. MCP: POST /api/v1/kbs/{kb_id}/mcp. Docs: docs/design/openapi-v1-spec.md.'

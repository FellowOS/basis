      type: http
      scheme: bearer
      description: User session JWT from POST /api/v1/auth/login (console / platform admin).
    kbApiTokenAuth:
      type: http
      scheme: bearer
      description: 'KB-scoped API token (read or write). Token must include this kb_id. Same tokens as MCP (Authorization:

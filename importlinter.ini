[importlinter]
root_package = basis

[importlinter:contract:core-no-api]
name = Core must not import api
type = forbidden
source_modules =
    basis.core
forbidden_modules =
    basis.api

[importlinter:contract:core-no-application]
name = Core must not import application
type = forbidden
source_modules =
    basis.core
forbidden_modules =
    basis.application

[importlinter:contract:core-no-control]
name = Core must not import control
type = forbidden
source_modules =
    basis.core
forbidden_modules =
    basis.control

[importlinter:contract:application-mcp-no-api]
name = MCP OpenAPI bridge must not import api
type = forbidden
source_modules =
    basis.application.mcp.openapi
forbidden_modules =
    basis.api

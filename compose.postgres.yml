services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sema
      POSTGRES_USER: sema
      POSTGRES_PASSWORD: sema
    ports:
      - "5432:5432"
    volumes:
      - sema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sema -d sema"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sema_postgres_data:

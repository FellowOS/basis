  output_schema:
    type: object
    properties:
      projects:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Jira project ID.
            key:
              type: string
              description: Jira project key.
            name:
              type: string
              description: Jira project name.
            raw:
              type: object
              additionalProperties: true
              description: Jira API object.
          additionalProperties: true
          description: Jira project.
      pagination:
        type: object
        properties:
          nextCursor:
            anyOf:
            - type: string

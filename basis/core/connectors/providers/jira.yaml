version: '2.0'
service: jira
display_name: Jira
description: Jira Cloud issues and projects via OAuth (Atlassian API).
categories:
- Productivity
- Developer Tools
homepage_url: https://www.atlassian.com/software/jira
docs_url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/
spec: {}
auth:
- auth_mode: oauth2
  base_url: https://api.atlassian.com
  headers:
    Authorization: Bearer ${credentials.access_token}
  connection_config:
  - key: subdomain
    label: Subdomain
    required: false
    description: The subdomain of your Attlassian account
    pattern: ^[a-zA-Z0-9.-]+$
  oauth2:
    authorization_url: https://auth.atlassian.com/authorize
    token_url: https://auth.atlassian.com/oauth/token
    pkce_s256: true
    authorization_params:
      audience: api.atlassian.com
      prompt: consent
actions:
- kind: entity
  id: issues
  display_name: Jira Issues
  cursor_field: fields.updated
  default_label_field: fields.summary
  fields:
  - name: id
    nullable: false
    primary_key: true
  - name: key
    nullable: false
  - name: fields.summary
  - name: fields.status.name
  - name: fields.priority.name
  - name: fields.updated
    data_type: datetime
  rest:
    operations:
      list:
        method: GET
        path: /ex/jira/{{config.cloudId}}/rest/api/3/search
        query:
          jql: project = {{config.projectKey}} ORDER BY updated DESC
        pagination:
          type: offset
          page_size: 50
          limit_param: maxResults
          offset_request_param: startAt
        records:
        - issues
      update:
        method: PUT
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue/{{external_id}}
        body:
          fields: '{{patch}}'
      create:
        method: POST
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue
        body:
          fields: '{{patch}}'
- kind: procedure
  id: jira.add_comment
  name: add_comment
  display_name: add_comment
  description: Add a comment to one Jira issue.
  rest:
    operations:
      invoke:
        method: POST
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue/{{issueIdOrKey}}/comment
  required_scopes:
  - write:jira-work
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      issueIdOrKey:
        type: string
        minLength: 1
        description: Jira issue ID or key.
      bodyText:
        type: string
        minLength: 1
        description: Plain text comment body converted to the connected deployment's
          document format.
      body:
        type: object
        properties:
          type:
            const: doc
            type: string
            description: ADF root node type.
          version:
            type: integer
            description: ADF document version.
          content:
            type: array
            items:
              description: ADF top-level node.
            description: ADF content nodes.
        additionalProperties: true
        required:
        - type
        - version
        - content
        description: Atlassian Document Format document.
    additionalProperties: false
    required:
    - issueIdOrKey
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      comment:
        type: object
        properties:
          id:
            type: string
            description: Jira comment ID.
          body:
            anyOf:
            - type: object
              properties:
                type:
                  const: doc
                  type: string
                  description: ADF root node type.
                version:
                  type: integer
                  description: ADF document version.
                content:
                  type: array
                  items:
                    description: ADF top-level node.
                  description: ADF content nodes.
              additionalProperties: true
              required:
              - type
              - version
              - content
              description: Atlassian Document Format document.
            - type: string
              description: Plain text comment body (Jira Server/Data Center).
            description: 'Jira comment body: an ADF document (Cloud) or plain text
              (Server/Data Center).'
          raw:
            type: object
            additionalProperties: true
            description: Jira API object.
        additionalProperties: true
        description: Jira comment.
    additionalProperties: false
    required:
    - comment
    description: Jira action output.
- kind: procedure
  id: jira.create_issue
  name: create_issue
  display_name: create_issue
  description: Create a Jira issue and return the normalized issue detail.
  rest:
    operations:
      invoke:
        method: POST
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue
  required_scopes:
  - write:jira-work
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      projectKey:
        type: string
        minLength: 1
        description: Jira project key.
      projectId:
        type: string
        minLength: 1
        description: Jira project ID.
      issueTypeId:
        type: string
        minLength: 1
        description: Jira issue type ID.
      issueTypeName:
        type: string
        minLength: 1
        description: Jira issue type name.
      summary:
        type: string
        minLength: 1
        description: Jira issue summary.
      descriptionText:
        type: string
        minLength: 1
        description: Plain text description converted to the connected deployment's
          document format.
      description:
        type: object
        properties:
          type:
            const: doc
            type: string
            description: ADF root node type.
          version:
            type: integer
            description: ADF document version.
          content:
            type: array
            items:
              description: ADF top-level node.
            description: ADF content nodes.
        additionalProperties: true
        required:
        - type
        - version
        - content
        description: Atlassian Document Format document.
      labels:
        type: array
        items:
          type: string
          minLength: 1
        description: Jira labels.
        minItems: 1
      assigneeAccountId:
        type: string
        minLength: 1
        description: Assignee account ID for Jira Cloud or username for Jira Data
          Center/Server.
      priorityId:
        type: string
        minLength: 1
        description: Jira priority ID.
      dueDate:
        type: string
        description: Jira due date in YYYY-MM-DD format.
        format: date
      parentIssueKey:
        type: string
        minLength: 1
        description: Parent issue key for subtasks.
      extraFields:
        type: object
        additionalProperties: true
        description: Jira API object.
    additionalProperties: false
    required:
    - summary
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      issue:
        type: object
        properties:
          id:
            type: string
            description: Jira issue ID.
          key:
            type: string
            description: Jira issue key.
          summary:
            type: string
            description: Jira issue summary.
          fields:
            type: object
            additionalProperties: true
            description: Jira API object.
          raw:
            type: object
            additionalProperties: true
            description: Jira API object.
        additionalProperties: true
        description: Jira issue.
    additionalProperties: false
    required:
    - issue
    description: Jira action output.
- kind: procedure
  id: jira.get_issue
  name: get_issue
  display_name: get_issue
  description: Get one Jira issue by issue ID or key.
  rest:
    operations:
      invoke:
        method: GET
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue/{{issueIdOrKey}}
  required_scopes:
  - read:jira-work
  - read:jira-user
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      issueIdOrKey:
        type: string
        minLength: 1
        description: Jira issue ID or key.
      includeFields:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira field ID or name.
        description: Additional Jira issue fields.
        minItems: 1
      expand:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira expand token.
        description: Additional Jira expand tokens.
        minItems: 1
    additionalProperties: false
    required:
    - issueIdOrKey
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      issue:
        type: object
        properties:
          id:
            type: string
            description: Jira issue ID.
          key:
            type: string
            description: Jira issue key.
          summary:
            type: string
            description: Jira issue summary.
          fields:
            type: object
            additionalProperties: true
            description: Jira API object.
          raw:
            type: object
            additionalProperties: true
            description: Jira API object.
        additionalProperties: true
        description: Jira issue.
    additionalProperties: false
    required:
    - issue
    description: Jira action output.
- kind: procedure
  id: jira.get_project
  name: get_project
  display_name: get_project
  description: Get one Jira project by project ID or key.
  rest:
    operations:
      invoke:
        method: GET
        path: /ex/jira/{{config.cloudId}}/rest/api/3/project/{{projectIdOrKey}}
  required_scopes:
  - read:jira-work
  - read:jira-user
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      projectIdOrKey:
        type: string
        minLength: 1
        description: Jira project ID or key.
      expand:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira expand token.
        description: Additional Jira expand tokens.
        minItems: 1
    additionalProperties: false
    required:
    - projectIdOrKey
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      project:
        type: object
        properties:
          id:
            type: string
            description: Jira project ID.
          key:
            type: string
            description: Jira project key.
          name:
            type: string
            description: Jira project name.
          raw:
            type: object
            additionalProperties: true
            description: Jira API object.
        additionalProperties: true
        description: Jira project.
    additionalProperties: false
    required:
    - project
    description: Jira action output.
- kind: procedure
  id: jira.list_issue_comments
  name: list_issue_comments
  display_name: list_issue_comments
  description: List comments for one Jira issue.
  rest:
    operations:
      invoke:
        method: GET
        path: /ex/jira/{{config.cloudId}}/rest/api/3/issue/{{issueIdOrKey}}/comment
  required_scopes:
  - read:jira-work
  - read:jira-user
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      issueIdOrKey:
        type: string
        minLength: 1
        description: Jira issue ID or key.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        description: Maximum items to return in one Jira page.
      cursor:
        type: string
        pattern: ^\d+$
        description: StartAt pagination cursor as a non-negative integer string.
      expand:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira expand token.
        description: Additional Jira expand tokens.
        minItems: 1
    additionalProperties: false
    required:
    - issueIdOrKey
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      comments:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Jira comment ID.
            body:
              anyOf:
              - type: object
                properties:
                  type:
                    const: doc
                    type: string
                    description: ADF root node type.
                  version:
                    type: integer
                    description: ADF document version.
                  content:
                    type: array
                    items:
                      description: ADF top-level node.
                    description: ADF content nodes.
                additionalProperties: true
                required:
                - type
                - version
                - content
                description: Atlassian Document Format document.
              - type: string
                description: Plain text comment body (Jira Server/Data Center).
              description: 'Jira comment body: an ADF document (Cloud) or plain text
                (Server/Data Center).'
            raw:
              type: object
              additionalProperties: true
              description: Jira API object.
          additionalProperties: true
          description: Jira comment.
      pagination:
        type: object
        properties:
          nextCursor:
            anyOf:
            - type: string
              description: Cursor for the next page.
            - type: 'null'
        additionalProperties: false
        required:
        - nextCursor
        description: Jira pagination metadata.
    additionalProperties: false
    required:
    - comments
    - pagination
    description: Jira action output.

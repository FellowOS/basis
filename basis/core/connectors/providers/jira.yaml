- kind: procedure
  id: jira.search_issues
  name: search_issues
  display_name: search_issues
  description: Search Jira issues with JQL on the connected Jira site.
  rest:
    operations:
      invoke:
        method: POST
        path: /ex/jira/{{config.cloudId}}/rest/api/3/search
  required_scopes:
  - read:jira-work
  - read:jira-user
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      jql:
        type: string
        minLength: 1
        description: Jira Query Language string.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        description: Maximum items to return in one Jira page.
      cursor:
        type: string
        minLength: 1
        description: Opaque pagination cursor returned by Jira.
      includeFields:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira field ID or name.
        description: Additional Jira issue fields.
        minItems: 1
      expand:
        type: array
        items:
          type: string
          minLength: 1
          description: Jira expand token.
        description: Additional Jira expand tokens.
        minItems: 1
    additionalProperties: false
    required:
    - jql
    description: The input payload for this action.
  output_schema:
    type: object
    properties:
      issues:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: Jira issue ID.
            key:
              type: string
              description: Jira issue key.
            summary:
              type: string
              description: Jira issue summary.
            fields:
              type: object
              additionalProperties: true
              description: Jira API object.
            raw:
              type: object
              additionalProperties: true
              description: Jira API object.
          additionalProperties: true
          description: Jira issue.
      pagination:
        type: object
        properties:
          nextCursor:
            anyOf:
            - type: string
              description: Cursor for the next page.
            - type: 'null'
        additionalProperties: false
        required:
        - nextCursor
        description: Jira pagination metadata.
    additionalProperties: false
    required:
    - issues
    - pagination
    description: Jira action output.
x-basis-ship-tier: beta

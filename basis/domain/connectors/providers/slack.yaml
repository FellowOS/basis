version: '2.0'
service: slack
display_name: Slack
description: Slack messaging and channels (procedure actions; form-encoded bodies
  planned).
categories:
- Communication
- Productivity
homepage_url: https://slack.com
docs_url: https://api.slack.com
spec: {}
auth:
- auth_mode: oauth2
  base_url: https://slack.com/api
  headers:
    Authorization: Bearer ${credentials.access_token}
  oauth2:
    authorization_url: https://slack.com/oauth/v2/authorize
    token_url: https://slack.com/api/oauth.v2.access
    scopes:
    - channels:read
    - channels:history
    - chat:write
    - reactions:write
  check:
    method: POST
    path: /auth.test
    display_name_path: team
- auth_mode: api_key
  base_url: https://slack.com/api
  headers:
    Authorization: Bearer ${credentials.bot_token}
  credentials:
  - key: bot_token
    label: Bot User OAuth Token
    input_type: password
    secret: true
  check:
    method: POST
    path: /auth.test
    display_name_path: team
actions:
- kind: procedure
  id: slack.add_reaction
  name: add_reaction
  display_name: add_reaction
  description: Add an emoji reaction to a Slack message.
  rest:
    operations:
      invoke:
        method: POST
        path: /reactions.add
  required_scopes:
  - reactions:write
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
      messageTs:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
    required:
    - channelId
    - messageTs
    - name
    additionalProperties: false
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
    required:
    - ok
- kind: procedure
  id: slack.post_message
  name: post_message
  display_name: post_message
  description: Send a message to a Slack channel.
  rest:
    operations:
      invoke:
        method: POST
        path: /chat.postMessage
  required_scopes:
  - chat:write
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
      text:
        type: string
        minLength: 1
      threadTs:
        type: string
    required:
    - channelId
    - text
    additionalProperties: false
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      ts:
        type: string
      channel:
        type: string
    required:
    - ok
- kind: procedure
  id: slack.conversations_list
  name: conversations_list
  display_name: conversations_list
  description: List public channels in the workspace.
  rest:
    operations:
      invoke:
        method: GET
        path: /conversations.list
  required_scopes:
  - channels:read
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 1000
      cursor:
        type: string
    additionalProperties: false
  output_schema:
    type: object
    properties:
      ok:
        type: boolean
      channels:
        type: array
        items:
          type: object
    required:
    - ok
x-basis-ship-tier: beta

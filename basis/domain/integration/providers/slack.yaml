  id: slack.list_conversations
  name: list_conversations
  display_name: list_conversations
  description: List Slack conversations visible to the bot.
  rest:
    operations:
      invoke:
        method: GET
        path: /conversations.list
  required_scopes:
  - channels:read
  - groups:read
  - im:read
  - mpim:read
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 200
        description: The maximum number of conversations to return.
      cursor:
        type: string
        description: The Slack pagination cursor.
      types:
        type: array
        items:
          type: string
          enum:
          - public_channel
          - private_channel
          - im
          - mpim
          description: A Slack conversation type.
        description: Conversation types to include.
        minItems: 1
      excludeArchived:
        type: boolean
        description: Whether archived conversations should be excluded.
    additionalProperties: false
    description: Input parameters for listing Slack conversations.
  output_schema:
    type: object
    properties:
      conversations:
        type: array
        items:
          type: object
          properties:
            channelId:
              type: string
              description: The unique identifier of the conversation.
            name:
              anyOf:
              - type: string
                description: The name of the conversation when available.
              - type: 'null'
            type:
              type: string
              enum:

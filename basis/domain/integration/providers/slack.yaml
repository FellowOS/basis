      messageTs:
        type: string
        description: The timestamp identifier of the target message.
      permalink:
        type: string
        description: The permalink URL returned by Slack.
    additionalProperties: false
    required:
    - channelId
    - messageTs
    - permalink
    description: The output payload for this action.
- kind: procedure
  id: slack.get_reactions

version: '2.0'
service: slack
display_name: Slack
categories:
- Communication
- Productivity
homepage_url: https://slack.com
spec: {}
auth:
- auth_mode: oauth2
  base_url: https://slack.com/api
  headers:
    Authorization: Bearer ${credentials.access_token}
  oauth2:
    authorization_url: https://slack.com/oauth/v2/authorize
    token_url: https://slack.com/api/oauth.v2.access
  check:
    method: POST
    path: /auth.test
    display_name_path: team
- auth_mode: api_key
  base_url: https://slack.com/api
  headers:
    Authorization: Bearer ${credentials.bot_token}
  credentials:
  - key: bot_token
    label: Bot User OAuth Token
    input_type: password
    secret: true
  check:
    method: POST
    path: /auth.test
    display_name_path: team
actions:
- kind: procedure
  id: slack.add_reaction
  name: add_reaction
  display_name: add_reaction
  description: Add an emoji reaction to a Slack message.
  rest:
    operations:
      invoke:
        method: POST
        path: /reactions.add
        body_encoding: form
  required_scopes:
  - reactions:write
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
        description: The Slack conversation or channel ID.
      messageTs:
        type: string
        minLength: 1
        description: The Slack message timestamp, for example '1711.0001'.
      name:
        type: string
        minLength: 1
        description: The emoji reaction name without surrounding colons.
    additionalProperties: false
    required:
    - channelId
    - messageTs
    - name
    description: Input parameters for adding a Slack reaction.
  output_schema:
    type: object
    properties:
      success:
        type: boolean
        description: Whether Slack accepted the reaction request.
    additionalProperties: false
    required:
    - success
    description: The output payload for this action.
- kind: procedure
  id: slack.delete_file
  name: delete_file
  display_name: delete_file
  description: Delete a Slack file.
  rest:
    operations:
      invoke:
        method: POST
        path: /files.delete
        body_encoding: form
  required_scopes:
  - files:write
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      fileId:
        type: string
        minLength: 1
        description: The Slack file ID.
    additionalProperties: false
    required:
    - fileId
    description: Input parameters for deleting a Slack file.
  output_schema:
    type: object
    properties:
      success:
        type: boolean
        description: Whether Slack accepted the file delete request.
      fileId:
        type: string
        description: The Slack file ID that was deleted.
    additionalProperties: false
    required:
    - success
    - fileId
    description: The output payload for this action.
- kind: procedure
  id: slack.delete_message
  name: delete_message
  display_name: delete_message
  description: Delete a Slack message posted by the bot.
  rest:
    operations:
      invoke:
        method: POST
        path: /chat.delete
        body_encoding: form
  required_scopes:
  - chat:write
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
        description: The Slack conversation or channel ID.
      messageTs:
        type: string
        minLength: 1
        description: The Slack message timestamp, for example '1711.0001'.
    additionalProperties: false
    required:
    - channelId
    - messageTs
    description: Input parameters for deleting a Slack message.
  output_schema:
    type: object
    properties:
      channelId:
        type: string
        description: The conversation identifier containing the message.
      messageTs:
        type: string
        description: The timestamp identifier of the message.
    additionalProperties: false
    required:
    - channelId
    - messageTs
    description: The output payload for a Slack message reference.
- kind: procedure
  id: slack.get_channel_messages
  name: get_channel_messages
  display_name: get_channel_messages
  description: Get recent messages from a Slack conversation.
  rest:
    operations:
      invoke:
        method: GET
        path: /conversations.history
  required_scopes:
  - channels:history
  - groups:history
  - im:history
  - mpim:history
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
        description: The Slack conversation or channel ID.
      limit:
        type: integer
        minimum: 1
        maximum: 100
        description: The maximum number of messages to return.
    additionalProperties: false
    required:
    - channelId
    description: Input parameters for reading Slack conversation history.
  output_schema:
    type: object
    properties:
      messages:
        type: array
        items:
          type: object
          properties:
            ts:
              type: string
              description: The message timestamp identifier.
            userId:
              type: string
              description: The user ID of the message author.
            text:
              type: string
              description: The text content of the message.
          additionalProperties: true
          description: A Slack message record.
        description: The list of messages in the conversation.
      hasMore:
        type: boolean
        description: Whether more messages are available beyond this page.
    additionalProperties: false
    required:
    - messages
    - hasMore
    description: The output payload for this action.
- kind: procedure
  id: slack.get_conversation
  name: get_conversation
  display_name: get_conversation
  description: Get metadata for a Slack conversation.
  rest:
    operations:
      invoke:
        method: GET
        path: /conversations.info
  required_scopes:
  - channels:read
  - groups:read
  - im:read
  - mpim:read
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      channelId:
        type: string
        minLength: 1
        description: The Slack conversation or channel ID.
      includeLocale:
        type: boolean
        description: Whether Slack should include the locale field.
      includeNumMembers:
        type: boolean
        description: Whether Slack should include the member count field.
    additionalProperties: false
    required:
    - channelId
    description: Input parameters for fetching a Slack conversation.
  output_schema:
    type: object
    properties:
      conversation:
        type: object
        properties:
          channelId:
            type: string
            description: The unique identifier of the conversation.
          name:
            anyOf:
            - type: string
              description: The name of the conversation when available.
            - type: 'null'
          type:
            type: string
            enum:
            - public_channel
            - private_channel
            - im
            - mpim
            - unknown
            description: The normalized Slack conversation type.
          isArchived:
            anyOf:
            - type: boolean
              description: Whether the conversation is archived.
            - type: 'null'
          isPrivate:
            anyOf:
            - type: boolean
              description: Whether the conversation is private.
            - type: 'null'
          isMember:
            anyOf:
            - type: boolean
              description: Whether the bot user is a member.
            - type: 'null'
          memberCount:
            type: integer
            description: The member count when Slack provides it.
          topic:
            anyOf:
            - type: string
              description: The conversation topic.
            - type: 'null'
          purpose:
            anyOf:
            - type: string
              description: The conversation purpose.
            - type: 'null'
          userId:
            type: string
            description: The linked user identifier for IM conversations.
          locale:
            type: string
            description: The locale returned by Slack when requested.
        additionalProperties: false
        required:
        - channelId
        - name
        - type
        - isArchived
        - isPrivate
        - isMember
        - topic
        - purpose
        description: A normalized Slack conversation record.
    additionalProperties: false
    required:
    - conversation
    description: The output payload for this action.
- kind: procedure
  id: slack.get_file
  name: get_file
  display_name: get_file
  description: Get metadata for a Slack file.
  rest:
    operations:
      invoke:
        method: GET
        path: /files.info
  required_scopes:
  - files:read
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      fileId:
        type: string
        minLength: 1

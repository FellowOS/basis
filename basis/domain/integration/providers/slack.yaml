          - name
          - type
          - isArchived
          - isPrivate
          - isMember
          - topic
          - purpose
          description: A normalized Slack conversation record.
        description: The list of Slack conversations.
      nextCursor:
        anyOf:
        - type: string
          description: The cursor for the next page.
        - type: 'null'

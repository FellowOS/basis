  id: slack.search_messages
  name: search_messages
  display_name: search_messages
  description: Search Slack messages visible to the connected user. Supports Slack
    search modifiers such as in:channel_name and from:<@UserID>.
  rest:
    operations:
      invoke:
        method: GET
        path: /search.messages
  required_scopes:
  - search:read
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties:
      query:
        type: string
        minLength: 1
        description: The Slack search query.
      count:
        type: integer
        minimum: 1
        maximum: 100
        description: The number of results to return per page.
      page:
        type: integer
        minimum: 1
        maximum: 100
        description: The Slack page number to fetch.
      cursor:
        type: string
        description: The Slack cursor for cursormark pagination. Use '*' for the first
          request.
      highlight:
        type: boolean
        description: Whether Slack should mark query terms in matching text.
      sort:
        type: string
        enum:
        - score
        - timestamp
        description: How Slack should sort search results.
      sortDir:
        type: string
        enum:
        - asc
        - desc
        description: The sort direction for Slack search results.
      teamId:
        type: string
        description: The encoded team ID to search when using an org-level token.
    additionalProperties: false
    required:
    - query
    description: Input parameters for searching Slack messages.
  output_schema:
    type: object
    properties:
      query:
        type: string
        description: The search query Slack executed.
      matches:
        type: array
        items:
          type: object
          properties:
            matchId:
              type: string
              description: Slack's search result item identifier.
            channelId:
              type: string
              description: The conversation identifier containing the message.
            channelName:
              anyOf:
              - type: string
                description: The conversation name when Slack returns one.
              - type: 'null'
            ts:
              type: string
              description: The message timestamp identifier.
            userId:
              type: string
              description: The user ID of the message author.
            username:
              type: string
              description: The username of the message author when Slack returns one.
            text:
              type: string
              description: The matching message text.
            permalink:
              type: string
              description: A Slack permalink for the matching message.
            teamId:
              type: string
              description: The Slack team ID returned for the match.
            type:
              type: string
              description: The Slack result type.
          additionalProperties: true
          description: A normalized Slack message search match.
        description: The matching Slack messages.
      total:
        type: integer
        description: The total number of matches Slack reports.
      pagination:
        type: object
        additionalProperties: true
        description: Slack pagination metadata when returned.
      paging:
        type: object
        additionalProperties: true
        description: Slack legacy paging metadata when returned.
      nextCursor:
        anyOf:
        - type: string
          description: The cursor for the next page when Slack returns one.
        - type: 'null'
    additionalProperties: false
    required:
    - query
    - matches
    - total
    - pagination
    - paging
    - nextCursor
    description: The output payload for this action.

version: '2.0'
service: gitlab
display_name: GitLab
description: GitLab projects, issues, and merge requests.
categories:
- Developer Tools
homepage_url: https://gitlab.com
docs_url: https://docs.gitlab.com/ee/api/api_resources.html
spec: {}
auth:
- auth_mode: oauth2
  base_url: https://gitlab.com
  headers:
    Authorization: Bearer ${credentials.access_token}
  oauth2:
    authorization_url: https://gitlab.com/oauth/authorize
    token_url: https://gitlab.com/oauth/token
    pkce_s256: true
    authorization_params:
      response_type: code
  check:
    path: /api/v4/user
    display_name_path: username
actions:
- kind: entity
  id: projects
  display_name: Projects
  cursor_field: last_activity_at
  default_label_field: path_with_namespace
  fields:
  - name: id
    data_type: integer
    nullable: false
    primary_key: true
  - name: name
  - name: path_with_namespace
  - name: description
  - name: web_url
  - name: last_activity_at
    data_type: datetime
  rest:
    operations:
      list:
        method: GET
        path: /api/v4/projects
        query:
          membership: 'true'
        pagination:
          type: page
          limit_param: per_page
          page_request_param: page
- kind: entity
  id: project_issues
  display_name: Project Issues
  cursor_field: updated_at
  default_label_field: title
  fields:
  - name: id
    data_type: integer
    nullable: false
    primary_key: true
  - name: iid
    data_type: integer
    nullable: false
  - name: title
    nullable: false
  - name: state
  - name: description
  - name: web_url
  - name: updated_at
    data_type: datetime
  rest:
    operations:
      list:
        method: GET
        path: /api/v4/projects/{{config.projectId}}/issues
        query:
          state: all
        pagination:
          type: page
          limit_param: per_page
          page_request_param: page
      update:
        method: PUT
        path: /api/v4/projects/{{config.projectId}}/issues/{{external_id}}
        body:
          patch: '{{patch}}'
      create:
        method: POST
        path: /api/v4/projects/{{config.projectId}}/issues
        body:
          patch: '{{patch}}'
- kind: procedure
  id: gitlab.create_merge_request
  name: create_merge_request
  display_name: create_merge_request
  description: Create a GitLab merge request from a source branch into a target branch.
  rest:
    operations:
      invoke:
        method: POST
        path: /api/v4/projects/{{projectId}}/merge_requests
  required_scopes:
  - api
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      projectId:
        type: string
        minLength: 1
        description: The GitLab project ID or URL-encoded path with namespace, such
          as 123 or group%2Fproject.
      sourceBranch:
        type: string
        minLength: 1
        description: The source branch name.
      targetBranch:
        type: string
        minLength: 1
        description: The target branch name.
      title:
        type: string
        minLength: 1
        description: The merge request title.
      description:
        type: string
        description: The merge request description.
      targetProjectId:
        type: integer
        description: The target project ID for a cross-project merge request.
      assigneeIds:
        type: array
        items:
          type: integer
          description: A GitLab user ID.
        description: Users to assign.
      reviewerIds:
        type: array
        items:
          type: integer
          description: A GitLab user ID.
        description: Users to review.
      labels:
        type: string
        description: Comma-separated label names.
      removeSourceBranch:
        type: boolean
        description: Whether to remove the source branch after merge.
      squash:
        type: boolean
        description: Whether to squash commits when merging.
    additionalProperties: false
    required:
    - projectId
    - sourceBranch
    - targetBranch
    - title
    description: GitLab action input.
  output_schema:
    type: object
    properties:
      id:
        type: integer
        description: The global merge request ID.
      iid:
        type: integer
        description: The internal merge request ID within the project.
      project_id:
        type: integer
        description: The target project ID.
      title:
        type: string
        description: The merge request title.
      description:
        anyOf:
        - type: string
          description: The merge request description.
        - type: 'null'
      state:
        type: string
        description: The merge request state.
      web_url:
        type: string
        description: The merge request URL.
      source_branch:
        type: string
        description: The source branch name.
      target_branch:
        type: string
        description: The target branch name.
      author:
        type: object
        properties:
          id:
            type: integer
            description: The GitLab user ID.
          username:
            type: string
            description: The GitLab username.
          name:
            type: string
            description: The display name.
          state:
            type: string
            description: The user state.
          avatar_url:
            anyOf:
            - type: string
              description: The avatar URL.
            - type: 'null'
          web_url:
            type: string
            description: The GitLab profile URL.
          email:
            type: string
            description: The email address when visible.
          public_email:
            type: string
            description: The public email address when visible.
        additionalProperties: true
        description: A GitLab user record.
      assignees:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: The GitLab user ID.
            username:
              type: string
              description: The GitLab username.
            name:
              type: string
              description: The display name.
            state:
              type: string
              description: The user state.
            avatar_url:
              anyOf:
              - type: string
                description: The avatar URL.
              - type: 'null'
            web_url:
              type: string
              description: The GitLab profile URL.
            email:
              type: string
              description: The email address when visible.
            public_email:
              type: string
              description: The public email address when visible.
          additionalProperties: true
          description: A GitLab user record.
        description: Users assigned to the merge request.
      reviewers:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              description: The GitLab user ID.
            username:
              type: string
              description: The GitLab username.
            name:
              type: string
              description: The display name.
            state:
              type: string
              description: The user state.
            avatar_url:
              anyOf:
              - type: string
                description: The avatar URL.
              - type: 'null'
            web_url:
              type: string
              description: The GitLab profile URL.
            email:
              type: string
              description: The email address when visible.
            public_email:
              type: string
              description: The public email address when visible.
          additionalProperties: true
          description: A GitLab user record.
        description: Users reviewing the merge request.
      labels:
        type: array
        items:
          type: string
          description: A label name.
        description: Labels attached to the merge request.
      merged_at:
        anyOf:
        - type: string
          description: The merge timestamp, when merged.
        - type: 'null'
      merge_status:
        type: string
        description: The merge readiness status.
      detailed_merge_status:
        type: string
        description: The detailed merge readiness status.
      sha:
        type: string
        description: The source branch commit SHA.
    additionalProperties: true
    description: A GitLab merge request record.
- kind: procedure
  id: gitlab.create_project
  name: create_project
  display_name: create_project
  description: Create a new GitLab project owned by the authenticated user.
  rest:
    operations:
      invoke:
        method: POST
        path: /api/v4/projects
  required_scopes:
  - api
  annotations:
    read_only_hint: false
  input_schema:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        description: The project name.
      path:
        type: string
        minLength: 1
        description: The repository path.
      namespaceId:
        type: integer
        description: The namespace ID for the project.
      description:
        type: string
        description: The project description.
      visibility:
        type: string
        enum:
        - private
        - internal
        - public
        description: The project visibility.
      initializeWithReadme:
        type: boolean
        description: Whether to initialize the repository with a README.
      defaultBranch:
        type: string
        description: The initial default branch name.
    additionalProperties: false
    required:
    - name
    description: GitLab action input.
  output_schema:
    type: object
    properties:
      id:
        type: integer
        description: The project ID.
      name:
        type: string
        description: The project name.
      path:
        type: string
        description: The project path.
      path_with_namespace:
        type: string
        description: The project path including namespace.
      description:
        anyOf:
        - type: string
          description: The project description.
        - type: 'null'
      default_branch:
        anyOf:
        - type: string
          description: The default branch name.
        - type: 'null'
      visibility:
        type: string
        description: The project visibility.
      web_url:
        type: string
        description: The project URL.
      ssh_url_to_repo:
        type: string
        description: The SSH clone URL.
      http_url_to_repo:
        type: string
        description: The HTTPS clone URL.
      readme_url:
        anyOf:
        - type: string
          description: The README URL when returned by GitLab.
        - type: 'null'
      created_at:
        type: string
        description: The project creation timestamp.
      last_activity_at:
        type: string
        description: The last activity timestamp.
      archived:
        type: boolean
        description: Whether the project is archived.
      star_count:
        type: integer
        description: The number of stars.
      forks_count:
        type: integer
        description: The number of forks.
      open_issues_count:
        type: integer
        description: The number of open issues.
      namespace:
        type: object
        properties:
          id:
            type: integer
            description: The namespace ID.
          name:
            type: string
            description: The namespace name.
          path:
            type: string
            description: The namespace path.
          kind:
            type: string
            description: The namespace kind.
          full_path:
            type: string
            description: The full namespace path.
        additionalProperties: true
        description: A GitLab namespace record.
    additionalProperties: true
    description: A GitLab project record.

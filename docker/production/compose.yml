# Production stack: Basis (API + Hono web in one container) → PostgreSQL.
# Usage: see docker/production/README.md

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basis}
      POSTGRES_USER: ${POSTGRES_USER:-basis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - basis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basis} -d ${POSTGRES_DB:-basis}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  basis:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
    ports:
      - "${BASIS_HTTP_PORT:-8080}:8080"
    environment:
      BASIS_HOST: 0.0.0.0
      BASIS_PORT: 8090
      BASIS_DATA_DIR: /data
      BASIS_DATABASE_URL: postgresql://${POSTGRES_USER:-basis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-basis}
      WEB_PORT: "8080"
      WEB_HOST: 0.0.0.0
    volumes:
      - basis_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  basis_postgres_data:
  basis_app_data:

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basis-client"
version = "0.1.0"
description = "Python HTTP client for Basis OpenAPI v1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6",
]

[tool.setuptools.packages.find]
include = ["basis_client*"]

[alembic]
script_location = basis/infra/tooling/db/alembic
prepend_sys_path = .
# CLI fallback when BASIS_DATABASE_URL is unset (same as BASIS_DATA_DIR=data → data/basis.db).
# Runtime and `alembic/env.py` use BASIS_DATABASE_URL when set.
sqlalchemy.url = sqlite:///data/basis.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
